apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonledger-ai-deployment
  namespace: carbonledger
  labels:
    app: carbonledger-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: carbonledger-ai
  template:
    metadata:
      labels:
        app: carbonledger-ai
    spec:
      containers:
      - name: ai-api
        image: carbonledger-ai:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: 2Gi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: carbonledger-ai-service
  namespace: carbonledger
spec:
  selector:
    app: carbonledger-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carbonledger-ai-hpa
  namespace: carbonledger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carbonledger-ai-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
