version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://carbonadmin:carbonpassword@db:5432/carbonledger
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_DIR=/app/vector_db/chroma_data
    volumes:
      - ../vector_db/chroma_data:/app/vector_db/chroma_data
    depends_on:
      - db
      - redis
      - chromadb

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=carbonadmin
      - POSTGRES_PASSWORD=carbonpassword
      - POSTGRES_DB=carbonledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  chromadata:
