services:
  # ----------------------------------------------------
  # 1. FastAPI Python Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: carbonledger-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: python run_server.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"

  # ----------------------------------------------------
  # 2. React / Vite Frontend Static Web App
  # ----------------------------------------------------
  - type: web
    name: carbonledger-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: carbonledger-api
          property: host
