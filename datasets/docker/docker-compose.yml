version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: carbonledger_db
    restart: always
    environment:
      POSTGRES_USER: carbonadmin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: carbonledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../schemas/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro
    networks:
      - carbonnetwork

  generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: carbonledger_generator
    depends_on:
      - db
    volumes:
      - ../output:/app/output
    networks:
      - carbonnetwork

volumes:
  pgdata:

networks:
  carbonnetwork:
    driver: bridge
